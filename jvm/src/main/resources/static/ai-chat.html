<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Chat - Cascade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#818cf8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/scala.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/kotlin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/haskell.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/nix.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/dockerfile.min.js"></script>
    <!-- Cache-buster: loads static assets with server version query param -->
    <script>
      (function() {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/version', false);
        try { xhr.send(); } catch (e) { return; }
        if (xhr.status !== 200) return;
        const v = JSON.parse(xhr.responseText)['buildVersion'];

        const baseCss = document.createElement('link');
        baseCss.rel = 'stylesheet';
        baseCss.href = '/static/base.css?v=' + v;
        document.head.appendChild(baseCss);

        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = '/static/ai-chat.css?v=' + v;
        document.head.appendChild(css);

        const js = document.createElement('script');
        js.src = '/static/js/main.js?v=' + v;
        document.head.appendChild(js);
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="/static/base.css">
      <link rel="stylesheet" href="/static/ai-chat.css">
    </noscript>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
