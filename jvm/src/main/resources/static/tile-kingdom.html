<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tile Kingdom - Cascade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#818cf8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="manifest" href="/static/tile-kingdom-manifest.json" />
    <!-- Cache-buster: loads static assets with server version query param -->
    <script>
      (function() {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/version', false);
        try { xhr.send(); } catch (e) { return; }
        if (xhr.status !== 200) return;
        const v = JSON.parse(xhr.responseText)['buildVersion'];

        const baseCss = document.createElement('link');
        baseCss.rel = 'stylesheet';
        baseCss.href = '/static/base.css?v=' + v;
        document.head.appendChild(baseCss);

        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = '/static/tile-kingdom.css?v=' + v;
        document.head.appendChild(css);

        const js = document.createElement('script');
        js.src = '/static/js/main.js?v=' + v;
        document.head.appendChild(js);
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="/static/base.css">
      <link rel="stylesheet" href="/static/tile-kingdom.css">
    </noscript>
  </head>
  <body>
    <div id="tile-kingdom-container" class="tile-kingdom-container">
      <!-- UI built dynamically by TileKingdom -->
    </div>
  </body>
</html>
