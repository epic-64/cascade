<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cascade Client</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      #app-log { white-space: pre-wrap; padding: .5rem 1rem; background: #f6f6f6; border: 1px solid #ddd; border-radius: 4px; }

      #counter-container {
        margin: 2rem 0;
        padding: 2rem;
        background: #f9f9f9;
        border: 2px solid #333;
        border-radius: 8px;
        max-width: 300px;
      }

      #counter-display {
        font-size: 4rem;
        font-weight: bold;
        text-align: center;
        margin-bottom: 1rem;
        color: #333;
      }

      #btn-container {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      #btn-container button {
        font-size: 2rem;
        padding: 0.5rem 2rem;
        cursor: pointer;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        transition: background 0.2s;
      }

      #btn-container button:hover {
        background: #0056b3;
      }

      #btn-container button:active {
        background: #004085;
      }
    </style>
  </head>
  <body>
    <h1>Cascade JS Client</h1>
    <p>Counter app demonstrating Scala.js client interacting with Cask server. Click the buttons to increment or decrement the counter.</p>
    <div id="app-log"></div>

    <!-- Scala.js compiled output -->
    <script src="/main.js"></script>
  </body>
</html>
