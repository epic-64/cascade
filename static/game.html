<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Color Rush - Multiplayer Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0a0a0f;
        color: #e4e4e7;
        min-height: 100vh;
        padding: 2rem 1rem;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      h1 {
        text-align: center;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
      }

      .subtitle {
        text-align: center;
        color: #a1a1aa;
        margin-bottom: 3rem;
        font-size: 0.95rem;
        font-weight: 400;
      }

      /* Lobby */
      .lobby {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(63, 63, 70, 0.4);
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .lobby h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: #e4e4e7;
      }

      .lobby input {
        width: 100%;
        padding: 0.875rem 1rem;
        font-size: 0.95rem;
        background: rgba(39, 39, 42, 0.5);
        border: 1px solid rgba(63, 63, 70, 0.6);
        border-radius: 8px;
        margin-bottom: 1rem;
        color: #e4e4e7;
        transition: all 0.2s;
      }

      .lobby input:focus {
        outline: none;
        border-color: #818cf8;
        background: rgba(39, 39, 42, 0.8);
      }

      .lobby input::placeholder {
        color: #71717a;
      }

      .lobby button {
        width: 100%;
        padding: 0.875rem;
        font-size: 0.95rem;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }

      .lobby button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      }

      .lobby button:active {
        transform: translateY(0);
      }

      /* Players List */
      .players {
        margin: 1.5rem 0;
      }

      .player-card {
        background: rgba(39, 39, 42, 0.4);
        border: 1px solid rgba(63, 63, 70, 0.4);
        padding: 1rem 1.25rem;
        margin: 0.75rem 0;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s;
      }

      .player-card:hover {
        background: rgba(39, 39, 42, 0.6);
        border-color: rgba(99, 102, 241, 0.3);
      }

      .player-name {
        font-weight: 600;
        color: #e4e4e7;
      }

      .player-score {
        color: #818cf8;
        font-size: 1.1rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* Game Area */
      .game-area {
        text-align: center;
      }

      .round-info {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(63, 63, 70, 0.4);
        padding: 2rem;
        border-radius: 16px;
        margin-bottom: 2rem;
      }

      .round-number {
        font-size: 0.875rem;
        color: #a1a1aa;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 500;
      }

      .target-color-label {
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        color: #d4d4d8;
      }

      .target-color {
        width: 120px;
        height: 120px;
        margin: 0 auto 1.5rem;
        border-radius: 16px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.1);
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        max-width: 480px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .color-button {
        aspect-ratio: 1;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        position: relative;
      }

      .color-button::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
        pointer-events: none;
      }

      .color-button:hover {
        transform: scale(1.08);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .color-button:active {
        transform: scale(0.96);
      }

      /* Winner Announcement */
      .winner-announcement {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(24, 24, 27, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(99, 102, 241, 0.3);
        padding: 3rem 4rem;
        border-radius: 20px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        text-align: center;
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes popIn {
        0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }

      .winner-announcement h2 {
        font-size: 2rem;
        margin: 0 0 1rem 0;
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 700;
      }

      .winner-announcement .points {
        font-size: 1.25rem;
        color: #fbbf24;
        font-weight: 600;
      }

      .hidden { display: none; }

      .start-button {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        margin-top: 1.5rem;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      }

      .start-button:hover {
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Color Rush</h1>
      <p class="subtitle">Be the fastest to click the matching color</p>

      <!-- Lobby -->
      <div id="lobby" class="lobby">
        <h2>Join Game</h2>
        <input type="text" id="gameId" placeholder="Game ID (e.g., game123)" value="game1" />
        <input type="text" id="playerName" placeholder="Your Name" />
        <button onclick="joinGame()">Join Game</button>

        <div id="waitingArea" class="hidden">
          <h3>Players in Lobby:</h3>
          <div id="playersList" class="players"></div>
          <button class="start-button" onclick="startGame()">Start Game</button>
        </div>
      </div>

      <!-- Game Area -->
      <div id="gameArea" class="game-area hidden">
        <div class="round-info">
          <div class="round-number">Round <span id="roundNumber">1</span> of 10</div>
          <div class="target-color-label">Click this color:</div>
          <div id="targetColor" class="target-color"></div>
        </div>

        <div class="color-grid" id="colorGrid"></div>

        <div class="players" id="gamePlayers"></div>
      </div>

      <!-- Winner Announcement -->
      <div id="winnerAnnouncement" class="winner-announcement hidden">
        <h2 id="winnerName"></h2>
        <p class="points" id="winnerPoints"></p>
      </div>
    </div>

    <script>
      let ws = null;
      let gameId = null;
      let currentPlayerId = null;
      let currentRoundId = null;

      function joinGame() {
        gameId = document.getElementById('gameId').value;
        const playerName = document.getElementById('playerName').value;

        if (!gameId || !playerName) {
          alert('Please enter both Game ID and your name');
          return;
        }

        // Connect to WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws/game/${gameId}`);

        ws.onopen = () => {
          console.log('Connected to game');
          ws.send(JSON.stringify({ type: 'join', playerName }));
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          handleMessage(msg);
        };

        ws.onerror = (error) => console.error('WebSocket error:', error);
        ws.onclose = () => console.log('Disconnected from game');

        // Hide join form
        document.getElementById('lobby').querySelector('h2').textContent = 'Waiting for players...';
        document.getElementById('gameId').disabled = true;
        document.getElementById('playerName').disabled = true;
        document.querySelector('.lobby button').style.display = 'none';
        document.getElementById('waitingArea').classList.remove('hidden');
      }

      function startGame() {
        if (ws) {
          ws.send(JSON.stringify({ type: 'start' }));
        }
      }

      function clickColor(color) {
        if (ws) {
          ws.send(JSON.stringify({
            type: 'click',
            color: color,
            time: Date.now()
          }));
        }
      }

      function handleMessage(msg) {
        console.log('Received:', msg);

        if (msg.type === 'gameUpdate') {
          updateGameState(msg.game);
        } else if (msg.type === 'roundWinner') {
          showRoundWinner(msg.playerName, msg.points);
        } else if (msg.type === 'gameEnd') {
          showGameWinner(msg.winner);
        }
      }

      function updateGameState(game) {
        // Update players list
        const playersList = document.getElementById('playersList');
        const gamePlayers = document.getElementById('gamePlayers');
        const playersHTML = Object.values(game.players)
          .sort((a, b) => b.score - a.score)
          .map(p => `
            <div class="player-card">
              <span class="player-name">${p.name}</span>
              <span class="player-score">${p.score} pts (${p.roundsWon} wins)</span>
            </div>
          `).join('');

        playersList.innerHTML = playersHTML;
        gamePlayers.innerHTML = playersHTML;

        // Show game area if playing
        if (game.status === 'playing' && game.currentRound) {
          document.getElementById('lobby').classList.add('hidden');
          document.getElementById('gameArea').classList.remove('hidden');

          const round = game.currentRound;
          const roundId = `${game.gameId}-${game.roundNumber}`;

          // Only update round display and start timer if this is a new round
          if (currentRoundId !== roundId) {
            currentRoundId = roundId;

            document.getElementById('roundNumber').textContent = game.roundNumber;
            document.getElementById('targetColor').style.backgroundColor = round.targetColor;

            // Update color grid
            const colorGrid = document.getElementById('colorGrid');
            colorGrid.innerHTML = round.colorOptions.map(color => `
              <button class="color-button"
                      style="background-color: ${color}"
                      onclick="clickColor('${color}')">
              </button>
            `).join('');
          }
        }
      }

      function showRoundWinner(playerName, points) {
        const announcement = document.getElementById('winnerAnnouncement');
        document.getElementById('winnerName').textContent = `${playerName} wins!`;
        document.getElementById('winnerPoints').textContent = `+${points} points`;
        announcement.classList.remove('hidden');

        setTimeout(() => {
          announcement.classList.add('hidden');
        }, 2000);
      }

      function showGameWinner(winner) {
        if (winner) {
          alert(`🎉 GAME OVER!\n\nWinner: ${winner.name}\nScore: ${winner.score} points\nRounds Won: ${winner.roundsWon}`);
        } else {
          alert('Game Over!');
        }

        // Reload page
        setTimeout(() => window.location.reload(), 3000);
      }
    </script>
  </body>
</html>
